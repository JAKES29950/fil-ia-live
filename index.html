<!-- Script de récupération via API RSS convertie -->
    <script>
        const BLOG_RSS = 'https://fil-IA.blogspot.com/feeds/posts/default?alt=rss';
        const FALLBACK_API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(BLOG_RSS)}`;

        let countdownInterval = null;
        const INTERVAL_DURATION = 120; // 2 minutes
        let timeLeft = INTERVAL_DURATION;
        let previousLatestTitle = null; // Modifié pour gérer correctement l'initialisation

        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                return new Date(dateString).toLocaleDateString('fr-FR', options);
            } catch (e) {
                return dateString;
            }
        }

        function cleanSnippet(htmlContent, maxLength = 160) {
            if (!htmlContent) return 'Aucun extrait disponible pour cet article...';
            const div = document.createElement('div');
            div.innerHTML = htmlContent;
            let text = div.textContent || div.innerText || '';
            text = text.trim();
            if (text.length > maxLength) {
                return text.substring(0, maxLength) + '...';
            }
            return text || 'Découvrez l’intégralité de cet article sur Fil-IA...';
        }

        function extractThumbnail(htmlContent) {
            if (!htmlContent) return null;
            const div = document.createElement('div');
            div.innerHTML = htmlContent;
            const img = div.querySelector('img');
            return img ? img.src : null;
        }

        function resetTimer() {
            clearInterval(countdownInterval);
            timeLeft = INTERVAL_DURATION;
            updateCountdownDisplay();
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateCountdownDisplay();
                if (timeLeft <= 0) {
                    timeLeft = INTERVAL_DURATION;
                    fetchArticles(false);
                }
            }, 1000);
        }

        function updateCountdownDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            const el = document.getElementById('countdown');
            if (el) el.textContent = `${minutes}:${seconds}`;
        }

        function triggerNewArticleAlert() {
            const banner = document.getElementById('featured-article-banner');
            banner.classList.add('ring-4', 'ring-blue-400');
            setTimeout(() => { banner.classList.remove('ring-4', 'ring-blue-400'); }, 4000);

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch (e) {}
        }

        async function fetchArticles(isManual = false) {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('fa-spin');
            
            const errorBanner = document.getElementById('error-banner');
            if (errorBanner) errorBanner.classList.add('hidden');

            try {
                // Ajout d'un paramètre aléatoire puissant pour contourner le cache de l'API rss2json
                const cacheBuster = `&api_key=&count=5&_t=${new Date().getTime()}`;
                const response = await fetch(FALLBACK_API + cacheBuster);
                
                if (!response.ok) throw new Error("Erreur réseau HTTP");
                
                const data = await response.json();

                if (data && data.status === 'ok' && data.items && data.items.length > 0) {
                    processAndDisplayArticles(data.items.slice(0, 5));
                } else {
                    throw new Error("Format de données invalide depuis l'API.");
                }
            } catch (error) {
                console.warn("Erreur de chargement :", error);
                showErrorState("Impossible de joindre le flux en direct. Nouvelle tentative automatique en cours...");
            }

            if (isManual) {
                resetTimer();
            }
        }

        function manualRefresh() {
            fetchArticles(true);
        }

        function processAndDisplayArticles(articles) {
            const loadingState = document.getElementById('loading-state');
            const container = document.getElementById('articles-container');
            const featuredBanner = document.getElementById('featured-article-banner');
            
            if (loadingState) loadingState.classList.add('hidden');
            if (container) container.classList.remove('hidden');
            if (featuredBanner) featuredBanner.classList.remove('hidden');

            const now = new Date();
            const updateTimeEl = document.getElementById('last-update-time');
            if (updateTimeEl) updateTimeEl.textContent = `Dernière mise à jour : ${now.toLocaleTimeString('fr-FR')}`;
            
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');

            const latest = articles[0];

            // Correction de la logique de détection : 
            // Si previousLatestTitle n'est plus null et est différent du nouveau titre -> Alerte !
            if (previousLatestTitle !== null && previousLatestTitle !== latest.title) {
                triggerNewArticleAlert();
            }
            previousLatestTitle = latest.title;

            // Mise à jour du bandeau vedette
            document.getElementById('featured-title').textContent = latest.title;
            document.getElementById('featured-snippet').textContent = cleanSnippet(latest.content || latest.description, 220);
            document.getElementById('featured-link').href = latest.link;
            document.getElementById('featured-date').textContent = formatDate(latest.pubDate);

            // Mise à jour de la grille des articles
            container.innerHTML = '';
            articles.forEach((art, index) => {
                const date = formatDate(art.pubDate);
                const snippet = cleanSnippet(art.content || art.description, 130);
                const thumb = extractThumbnail(art.content || art.description) || art.thumbnail;

                const card = document.createElement('div');
                card.className = `glow-card bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 relative overflow-hidden group`;
                
                let thumbHtml = '';
                if (thumb) {
                    thumbHtml = `<div class="mb-3 h-36 w-full overflow-hidden rounded-xl bg-slate-800"><img src="${thumb}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.style.display='none'"></div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-blue-400 border border-slate-700">#0${index + 1}</span>
                            <span class="text-xs text-slate-400 flex items-center space-x-1">
                                <i class="fa-regular fa-clock text-[10px]"></i>
                                <span>${date}</span>
                            </span>
                        </div>
                        ${thumbHtml}
                        <h3 class="text-base font-bold text-white mb-2 group-hover:text-blue-400 transition line-clamp-2">${art.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-400 line-clamp-3 mb-4">${snippet}</p>
                    </div>
                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
                        <a href="${art.link}" target="_blank" class="inline-flex items-center space-x-2 text-xs font-semibold text-blue-400 hover:text-blue-300 transition">
                            <span>Lire l'article</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                        <span class="w-2 h-2 rounded-full bg-blue-500 opacity-0 group-hover:opacity-100 transition"></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showErrorState(msg) {
            const loadingState = document.getElementById('loading-state');
            if (loadingState) loadingState.classList.add('hidden');
            const errorBanner = document.getElementById('error-banner');
            if (errorBanner) errorBanner.classList.remove('hidden');
            const errMsg = document.getElementById('error-message');
            if (errMsg) errMsg.textContent = msg;
            
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
        }

        window.onload = function() {
            fetchArticles(false);
            resetTimer();
        };
    </script>
